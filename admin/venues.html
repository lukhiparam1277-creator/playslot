<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue Moderation - PlaySlot Admin</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/owner.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Dynamic Admin Sidebar -->
    <div id="admin-sidebar-container"></div>

    <main class="dash-main">
      <header class="dash-header">
        <div class="dash-header-title">
          <h2>All Platform Sports Arenas</h2>
        </div>
      </header>

      <div class="dash-body">
        
        <!-- Venues Moderation Table -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
            <div>
              <h3 style="font-size:1.2rem; margin-bottom:2px;">Platform Venues Registry</h3>
              <p style="font-size:0.85rem;">Audit sports turfs, verify pricing, and moderate active status</p>
            </div>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Venue Name</th>
                  <th>Partner Owner</th>
                  <th>City</th>
                  <th>Sports</th>
                  <th>Hourly Rate</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminVenuesTbody">
                <!-- Rendered by admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { AdminController } from '../js/admin.js';
    AdminController.initVenues();
  </script>
</body>
</html>
