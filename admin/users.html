<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - PlaySlot Admin</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/owner.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Dynamic Admin Sidebar -->
    <div id="admin-sidebar-container"></div>

    <main class="dash-main">
      <header class="dash-header">
        <div class="dash-header-title">
          <h2>Player / User Management</h2>
        </div>
      </header>

      <div class="dash-body">
        
        <!-- Action Toolbar -->
        <div class="action-toolbar">
          <div class="search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="userSearchInput" class="form-input" placeholder="Search user by name or email...">
          </div>

          <select id="userStatusFilter" class="form-select" style="width:auto;">
            <option value="All">All User Statuses</option>
            <option value="Active">Active Only</option>
            <option value="Suspended">Suspended Only</option>
          </select>
        </div>

        <!-- Users Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Player Name</th>
                  <th>Email</th>
                  <th>Phone Number</th>
                  <th>Account Status</th>
                  <th>Joined Date</th>
                  <th>Bookings Count</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="adminUsersTbody">
                <!-- Rendered by admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { AdminController } from '../js/admin.js';
    AdminController.initUsers();
  </script>
</body>
</html>
