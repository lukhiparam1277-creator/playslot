<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Owner Login - PlaySlot</title>
  <meta name="description" content="Sign in to the PlaySlot Turf Partner Console to manage turf schedules and bookings.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge" style="width:48px; height:48px; margin:0 auto 12px auto; font-size:1.6rem; background:linear-gradient(135deg, var(--secondary-color), #059669);">🏟️</div>
        <h2 style="font-size:1.7rem; font-weight:900;">Turf Owner Login</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">
          Access your turf arena management dashboard
        </p>
      </div>

      <div id="ownerLoginAlert"></div>

      <!-- Quick Demo Turf Owner Hint -->
      <div style="background:var(--bg-color); border:1px dashed var(--border-color); padding:12px 14px; border-radius:10px; margin-bottom:20px; font-size:0.85rem;">
        <span style="font-weight:700; color:var(--text-dark);">⚡ Approved Demo Owner Account:</span><br>
        <code style="color:var(--primary-color); font-weight:600;">owner@playslot.com</code> / <code>password123</code>
      </div>

      <form id="ownerLoginForm">
        <div class="form-group" style="margin-bottom:16px;">
          <label>📧 Partner Email</label>
          <input type="email" id="ownerEmail" class="form-input" placeholder="e.g. owner@playslot.com" value="owner@playslot.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom:22px;">
          <label>🔒 Password</label>
          <input type="password" id="ownerPassword" class="form-input" placeholder="••••••••" value="password123" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-emerald" style="width:100%; height:50px; font-size:1.05rem;">
          Login to Turf Owner Console 🏟️
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--border-color); font-size:0.88rem; color:var(--text-muted); display:flex; flex-direction:column; gap:8px;">
        <div>
          Not an approved partner yet? <a href="/owner/apply" style="color:var(--secondary-color); font-weight:800;">Apply to List Your Turf</a>
        </div>
        <div>
          Applied recently? <a href="/owner/status" style="color:var(--primary-color); font-weight:800;">Check Application Status</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/data/mock-data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/owner-login.js"></script>
</body>
</html>
