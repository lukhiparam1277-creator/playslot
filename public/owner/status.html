<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Partner Application Status - PlaySlot</title>
  <meta name="description" content="Check your PlaySlot turf partner application status and review approval notices.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="container" style="padding-top:40px; padding-bottom:80px; max-width:800px;">
    <div style="text-align:center; margin-bottom:28px;">
      <h1 style="font-size:2rem; font-weight:900;">Partner Application Status</h1>
      <p style="color:var(--text-muted); font-size:0.95rem; margin-top:4px;">
        Track review progress for your turf venue listing application
      </p>
    </div>

    <!-- Search / Lookup Bar -->
    <div class="search-card" style="margin-bottom:32px; padding:18px;">
      <div style="display:flex; gap:12px; align-items:center;">
        <input type="text" id="statusSearchInput" class="form-input" placeholder="Enter Application ID (e.g. PS-OWNER-10245) or Email..." style="height:48px;">
        <button id="statusSearchBtn" class="btn btn-primary" style="height:48px; padding:0 24px;">Check Status 🔍</button>
      </div>
    </div>

    <!-- Results Container -->
    <div id="statusResultContainer">
      <!-- Rendered dynamically by owner-status.js -->
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/data/mock-data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/owner-status.js"></script>
</body>
</html>
