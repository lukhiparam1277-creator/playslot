<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Owner Console - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="owner-body">

<div class="owner-layout">
  <!-- Sidebar -->
  <aside class="owner-sidebar">
    <div class="owner-logo">
      <div class="logo-badge" style="width:34px; height:34px; font-size:1.1rem;">🏟️</div>
      <span>PlaySlot <strong>Owner</strong></span>
    </div>
    
    <div id="ownerSidebarProfile" style="padding:14px; margin-bottom:24px; background:rgba(255,255,255,0.06); border-radius:12px; display:flex; align-items:center; gap:12px; border:1px solid rgba(255,255,255,0.08);">
      <img id="ownerAvatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--secondary-color);">
      <div style="overflow:hidden;">
        <div id="ownerName" style="color:#ffffff; font-weight:800; font-size:0.92rem; white-space:nowrap; text-overflow:ellipsis;">Vikram Malhotra</div>
        <span class="badge badge-primary" style="font-size:0.68rem; padding:2px 8px; margin-top:2px;">🏟️ Turf Owner</span>
      </div>
    </div>

    <ul class="owner-nav">
      <li class="owner-nav-item active" data-section="dashboard"><a href="#">📊 Dashboard</a></li>
      <li class="owner-nav-item" data-section="turfs"><a href="#">🏟️ My Turfs</a></li>
      <li class="owner-nav-item" data-section="add-turf"><a href="#">➕ Add Turf</a></li>
      <li class="owner-nav-item" data-section="slots"><a href="#">⏰ Slot Manager</a></li>
      <li class="owner-nav-item" data-section="bookings"><a href="#">🎟️ Bookings</a></li>
      <li class="owner-nav-item" data-section="earnings"><a href="#">💰 Earnings</a></li>
      <li class="owner-nav-item"><a href="/venues.html" target="_blank">🌐 Browse Turfs ↗</a></li>
      <li class="owner-nav-item"><a href="/index.html" target="_blank">⚽ Public Site ↗</a></li>
    </ul>

    <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
      <button onclick="PlaySlotApp.logout()" class="btn btn-outline-dark" style="width:100%; color:#FFFFFF; border-color:rgba(255,255,255,0.2);">
        Log Out Owner
      </button>
    </div>
  </aside>

  <!-- Main View Area -->
  <main class="owner-main" id="ownerSectionContainer">
    <!-- Rendered dynamically by owner-dashboard.js -->
  </main>
</div>

<!-- Global Toast & Modal Container hooks -->
<script src="/js/data/mock-data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/owner-dashboard.js"></script>
</body>
</html>
