<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Turfs & Arenas - PlaySlot</title>
  <meta name="description" content="Discover and book verified turfs with real-time slot availability. Filter by sport, city, pricing, and amenities.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:16px;">
      <div>
        <div class="section-title">Explore Verified Turfs (<span id="totalTurfsCount">10</span>)</div>
        <div class="section-subtitle" style="margin-bottom:0;">Find and reserve professional sports turfs with real-time slot availability</div>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="search-card" style="margin-bottom:40px;">
      <form id="venueFilterForm" class="search-form" style="grid-template-columns: repeat(4, 1fr) auto;">
        <div class="form-group">
          <label>🔍 Search Turf / Area</label>
          <input type="text" id="filterSearch" placeholder="Turf name or location..." class="form-input">
        </div>

        <div class="form-group">
          <label>🏆 Sport</label>
          <select id="filterSport" class="form-select">
            <option value="All">All Sports (8)</option>
            <option value="Cricket">🏏 Cricket</option>
            <option value="Football">⚽ Football</option>
            <option value="Badminton">🏸 Badminton</option>
            <option value="Basketball">🏀 Basketball</option>
            <option value="Tennis">🎾 Tennis</option>
            <option value="Volleyball">🏐 Volleyball</option>
            <option value="Box Cricket">🏟️ Box Cricket</option>
            <option value="Pickleball">🏓 Pickleball</option>
          </select>
        </div>

        <div class="form-group">
          <label>📍 City</label>
          <select id="filterCity" class="form-select">
            <option value="All">All Cities</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Bengaluru">Bengaluru</option>
            <option value="Delhi">Delhi / Gurugram</option>
          </select>
        </div>

        <div class="form-group">
          <label>🏠 Turf Type</label>
          <select id="filterType" class="form-select">
            <option value="All">All Types</option>
            <option value="Indoor">Indoor</option>
            <option value="Outdoor">Outdoor</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" style="height:48px;">Apply 🎯</button>
      </form>

      <!-- Advanced Filters Row -->
      <div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:20px; padding-top:16px; border-top:1px solid var(--border-color); align-items:center;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-dark);">💰 Max Price:</span>
          <input type="number" id="filterMaxPrice" placeholder="e.g. 1500" class="form-input" style="width:110px; height:38px; padding:4px 10px; font-size:0.85rem;">
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-dark);">⭐ Min Rating:</span>
          <select id="filterMinRating" class="form-select" style="width:120px; height:38px; padding:4px 10px; font-size:0.85rem;">
            <option value="">Any Rating</option>
            <option value="4.8">★ 4.8+</option>
            <option value="4.5">★ 4.5+</option>
            <option value="4.0">★ 4.0+</option>
          </select>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-dark);">📏 Distance:</span>
          <select id="filterMaxDistance" class="form-select" style="width:130px; height:38px; padding:4px 10px; font-size:0.85rem;">
            <option value="">Any Distance</option>
            <option value="2">Within 2 km</option>
            <option value="3">Within 3 km</option>
            <option value="5">Within 5 km</option>
          </select>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:0.85rem; font-weight:700; color:var(--text-dark);">⚡ Sort:</span>
          <select id="filterSort" class="form-select" style="width:160px; height:38px; padding:4px 10px; font-size:0.85rem;">
            <option value="default">Recommended</option>
            <option value="price_low">Price: Low to High</option>
            <option value="price_high">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
            <option value="distance">Nearest Distance</option>
          </select>
        </div>

        <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; font-weight:600; cursor:pointer; margin-left:auto;">
          <input type="checkbox" id="filterAvailToday"> Available Today Only
        </label>

        <button id="resetFiltersBtn" class="btn btn-outline-dark" style="padding:6px 14px; font-size:0.85rem;">Reset</button>
      </div>
    </div>

    <!-- Venues Grid -->
    <div class="venues-grid" id="venuesGrid"></div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/data/mock-data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/venues.js"></script>
</body>
</html>
