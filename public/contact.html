<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div class="section-title">Get in Touch with PlaySlot</div>
    <div class="section-subtitle">Have questions or need assistance with your venue booking? We are here to help!</div>

    <div id="contactAlert"></div>

    <div style="display:grid; grid-template-columns:1.2fr 1fr; gap:40px;">
      <!-- Contact Form -->
      <div class="summary-card">
        <h3 style="font-size:1.3rem; font-weight:700; margin-bottom:20px;">Send Us a Message</h3>
        <form id="contactForm">
          <div class="form-group" style="margin-bottom:16px;">
            <label>Full Name</label>
            <input type="text" id="contactName" class="form-input" placeholder="Your name" required>
          </div>
          <div class="form-group" style="margin-bottom:16px;">
            <label>Email Address</label>
            <input type="email" id="contactEmail" class="form-input" placeholder="Your email address" required>
          </div>
          <div class="form-group" style="margin-bottom:16px;">
            <label>Subject</label>
            <input type="text" id="contactSubject" class="form-input" placeholder="e.g. Venue Inquiry / Booking Query" required>
          </div>
          <div class="form-group" style="margin-bottom:24px;">
            <label>Message</label>
            <textarea id="contactMessage" rows="5" class="form-input" placeholder="How can we assist you?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Submit Message 📨</button>
        </form>
      </div>

      <!-- Contact Info & Map -->
      <div>
        <div class="summary-card" style="margin-bottom:24px;">
          <h3 style="font-size:1.2rem; font-weight:700; margin-bottom:16px;">Corporate Head Office</h3>
          <div style="display:flex; flex-direction:column; gap:16px; font-size:0.95rem;">
            <div>
              <strong>📍 Address:</strong><br>
              100 Feet Road, Indiranagar, Bengaluru, KA 560038
            </div>
            <div>
              <strong>📞 Phone Number:</strong><br>
              +91 98765 43210 / +91 80 4920 1100
            </div>
            <div>
              <strong>✉️ Email Address:</strong><br>
              support@playslot.com
            </div>
          </div>
        </div>

        <div style="width:100%; height:240px; border-radius:var(--border-radius); overflow:hidden; border:1px solid var(--border-color);">
          <iframe width="100%" height="100%" frameborder="0" style="border:0" src="https://maps.google.com/maps?q=Indiranagar+Bengaluru&t=&z=13&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script>
  document.getElementById('contactForm').addEventListener('submit', (e) => {
    e.preventDefault();
    document.getElementById('contactAlert').innerHTML = '<div class="alert alert-success">✓ Thank you for contacting PlaySlot! Our team will get back to you within 24 hours.</div>';
    e.target.reset();
  });
  </script>
</body>
</html>
