<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body style="background:#0F172A; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

  <div class="auth-card" style="background:#ffffff; max-width:440px;">
    <div class="auth-header">
      <div class="logo" style="justify-content:center; font-size:2rem; margin-bottom:12px;">
        <span>⚽</span> PlaySlot Admin
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem;">Sign in to management console</p>
    </div>

    <div id="adminLoginAlert"></div>

    <form id="adminLoginForm">
      <div class="form-group" style="margin-bottom:18px;">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" class="form-input" placeholder="admin@playslot.com" required>
      </div>

      <div class="form-group" style="margin-bottom:24px;">
        <label>Password</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; height:48px;">Login to Admin Panel 🔒</button>
    </form>

    <div style="margin-top:20px; text-align:center; font-size:0.85rem; color:var(--text-muted);">
      Default Demo Admin: <code>admin@playslot.com</code> / <code>admin123</code>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
  document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;

    if (email === 'admin@playslot.com' && password === 'admin123') {
      const adminUser = {
        _id: 'admin-1',
        name: 'PlaySlot Admin',
        email: 'admin@playslot.com',
        role: 'admin',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'
      };
      PlaySlotApp.setUser(adminUser);
      window.location.href = '/admin/dashboard.html';
    } else {
      document.getElementById('adminLoginAlert').innerHTML = '<div class="alert alert-danger">⚠️ Invalid admin credentials</div>';
    }
  });
  </script>
</body>
</html>
