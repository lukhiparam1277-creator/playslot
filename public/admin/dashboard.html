<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Console - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="admin-body">

<div class="admin-layout">
  <!-- Admin Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">
      <div class="logo-badge" style="width:34px; height:34px; font-size:1.1rem; background:linear-gradient(135deg, var(--accent-purple), #6D28D9);">🛡️</div>
      <span>PlaySlot <strong>Admin</strong></span>
    </div>

    <div style="padding:14px; margin-bottom:24px; background:rgba(255,255,255,0.06); border-radius:12px; display:flex; align-items:center; gap:12px; border:1px solid rgba(255,255,255,0.08);">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--accent-purple);">
      <div style="overflow:hidden;">
        <div style="color:#ffffff; font-weight:800; font-size:0.92rem; white-space:nowrap; text-overflow:ellipsis;">Platform Admin</div>
        <span class="badge badge-purple" style="font-size:0.68rem; padding:2px 8px; margin-top:2px;">SUPER ADMIN</span>
      </div>
    </div>

    <ul class="admin-nav">
      <li class="admin-nav-item active" data-section="dashboard"><a href="#">📊 Overview</a></li>
      <li class="admin-nav-item"><a href="/admin/owner-requests">📝 Owner Requests</a></li>
      <li class="admin-nav-item" data-section="users"><a href="#">👥 Athletes & Users</a></li>
      <li class="admin-nav-item" data-section="owners"><a href="#">🏟️ Turf Owners</a></li>
      <li class="admin-nav-item" data-section="turfs"><a href="#">⛳ Turfs Moderation</a></li>
      <li class="admin-nav-item" data-section="bookings"><a href="#">🎟️ All Bookings</a></li>
      <li class="admin-nav-item" data-section="sports"><a href="#">🏆 Sports Management</a></li>
      <li class="admin-nav-item" data-section="reports"><a href="#">📈 Financial Reports</a></li>
      <li class="admin-nav-item" data-section="settings"><a href="#">⚙️ Platform Settings</a></li>
      <li class="admin-nav-item"><a href="/" target="_blank">⚽ Live Public Site ↗</a></li>
    </ul>

    <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
      <button onclick="PlaySlotApp.logout()" class="btn btn-outline-dark" style="width:100%; color:#FFFFFF; border-color:rgba(255,255,255,0.2);">
        Log Out Admin
      </button>
    </div>
  </aside>

  <!-- Admin Main View -->
  <main class="admin-main" id="adminSectionContainer">
    <!-- Rendered dynamically by admin-dashboard.js -->
  </main>
</div>

<script src="/js/data/mock-data.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin-dashboard.js"></script>
</body>
</html>
