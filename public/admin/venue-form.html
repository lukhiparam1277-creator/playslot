<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Venue - PlaySlot Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo"><span>⚽</span> PlaySlot</div>
    <ul class="admin-nav">
      <li class="admin-nav-item"><a href="/admin/dashboard.html">📊 Dashboard</a></li>
      <li class="admin-nav-item"><a href="/admin/sports.html">🏆 Sports</a></li>
      <li class="admin-nav-item active"><a href="/admin/venues.html">🏟️ Venues</a></li>
      <li class="admin-nav-item"><a href="/admin/bookings.html">🎟️ Bookings</a></li>
      <li class="admin-nav-item"><a href="/admin/users.html">👥 Users</a></li>
    </ul>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Add New Sports Venue</h1>
        <p style="color:#64748B; font-size:0.9rem;">Fill venue details, amenities, slot pricing, and image URLs</p>
      </div>

      <a href="/admin/venues.html" class="btn btn-outline">← Back to Venues</a>
    </div>

    <div class="summary-card" style="max-width:840px;">
      <form id="addVenueForm">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px;">
          <div class="form-group">
            <label>Venue Name</label>
            <input type="text" id="vName" class="form-input" placeholder="e.g. Apex Football Arena" required>
          </div>

          <div class="form-group">
            <label>Sport Category</label>
            <select id="vSport" class="form-select" required>
              <option value="Football Turf">⚽ Football Turf</option>
              <option value="Box Cricket">🏏 Box Cricket</option>
              <option value="Pickleball">🎾 Pickleball</option>
              <option value="Badminton">🏸 Badminton</option>
              <option value="Basketball">🏀 Basketball</option>
              <option value="Golf">⛳ Golf</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:18px;">
          <div class="form-group">
            <label>City</label>
            <select id="vCity" class="form-select" required>
              <option value="Mumbai">Mumbai</option>
              <option value="Bengaluru">Bengaluru</option>
              <option value="Delhi">Delhi</option>
            </select>
          </div>

          <div class="form-group">
            <label>Location / Area</label>
            <input type="text" id="vLocation" class="form-input" placeholder="e.g. Bandra West" required>
          </div>

          <div class="form-group">
            <label>Price Per Hour (₹)</label>
            <input type="number" id="vPrice" class="form-input" placeholder="1200" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label>Full Address</label>
          <input type="text" id="vAddress" class="form-input" placeholder="Plot 12, Link Road, Mumbai" required>
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label>Venue Description</label>
          <textarea id="vDesc" rows="3" class="form-input" placeholder="Describe turf quality, dimensions, lighting..."></textarea>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label>Facilities & Amenities</label>
          <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:8px;">
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Parking" checked> 🚗 Parking</label>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Washroom" checked> 🚿 Washroom</label>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Flood Lights" checked> 💡 Flood Lights</label>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Drinking Water" checked> 💧 Drinking Water</label>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Equipment Rental"> 🏏 Equipment Rental</label>
            <label style="display:flex; align-items:center; gap:8px; font-size:0.9rem;"><input type="checkbox" class="fac-chk" value="Air Conditioning"> ❄️ Air Conditioning</label>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label>Venue Image URL</label>
          <input type="text" id="vImage" class="form-input" placeholder="https://images.unsplash.com/...">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:50px; font-size:1rem;">Publish Venue 🚀</button>
      </form>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
