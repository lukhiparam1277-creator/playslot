<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Category Management - PlaySlot Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo"><span>⚽</span> PlaySlot</div>
    <ul class="admin-nav">
      <li class="admin-nav-item"><a href="/admin/dashboard.html">📊 Dashboard</a></li>
      <li class="admin-nav-item active"><a href="/admin/sports.html">🏆 Sports</a></li>
      <li class="admin-nav-item"><a href="/admin/venues.html">🏟️ Venues</a></li>
      <li class="admin-nav-item"><a href="/admin/bookings.html">🎟️ Bookings</a></li>
      <li class="admin-nav-item"><a href="/admin/users.html">👥 Users</a></li>
    </ul>
    <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
      <button onclick="PlaySlotApp.logout()" class="btn btn-outline" style="width:100%; color:#ffffff; border-color:rgba(255,255,255,0.3);">Logout Admin</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Sport Category Management (6)</h1>
        <p style="color:#64748B; font-size:0.9rem;">Add, toggle status, or delete sports categories</p>
      </div>

      <button id="openAddSportModal" class="btn btn-primary">+ Add New Sport</button>
    </div>

    <div id="adminSportsAlert"></div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Icon</th>
              <th>Sport Name</th>
              <th>Description</th>
              <th>Category</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminSportsTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="sportModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
  <div class="summary-card" style="width:100%; max-width:500px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h3 style="font-size:1.3rem; font-weight:700;">Add New Sport Category</h3>
      <button id="closeSportModal" style="background:none; border:none; font-size:1.4rem; cursor:pointer;">✕</button>
    </div>

    <form id="addSportForm">
      <div class="form-group" style="margin-bottom:16px;">
        <label>Sport Name</label>
        <select id="newSportName" class="form-select" required>
          <option value="Football Turf">⚽ Football Turf</option>
          <option value="Box Cricket">🏏 Box Cricket</option>
          <option value="Pickleball">🎾 Pickleball</option>
          <option value="Badminton">🏸 Badminton</option>
          <option value="Basketball">🏀 Basketball</option>
          <option value="Golf">⛳ Golf</option>
        </select>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Emoji / Icon</label>
        <input type="text" id="newSportIcon" class="form-input" placeholder="e.g. ⚽" required>
      </div>

      <div class="form-group" style="margin-bottom:16px;">
        <label>Description</label>
        <textarea id="newSportDesc" class="form-input" rows="3" placeholder="Brief description..."></textarea>
      </div>

      <div class="form-group" style="margin-bottom:24px;">
        <label>Sport Banner Image URL</label>
        <input type="text" id="newSportImg" class="form-input" placeholder="https://images.unsplash.com/...">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;">Create Sport Category</button>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
