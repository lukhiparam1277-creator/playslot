<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Management - PlaySlot Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-logo"><span>⚽</span> PlaySlot</div>
    <ul class="admin-nav">
      <li class="admin-nav-item"><a href="/admin/dashboard.html">📊 Dashboard</a></li>
      <li class="admin-nav-item"><a href="/admin/sports.html">🏆 Sports</a></li>
      <li class="admin-nav-item"><a href="/admin/venues.html">🏟️ Venues</a></li>
      <li class="admin-nav-item active"><a href="/admin/bookings.html">🎟️ Bookings</a></li>
      <li class="admin-nav-item"><a href="/admin/users.html">👥 Users</a></li>
    </ul>
    <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
      <button onclick="PlaySlotApp.logout()" class="btn btn-outline" style="width:100%; color:#ffffff; border-color:rgba(255,255,255,0.3);">Logout Admin</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Booking Management</h1>
        <p style="color:#64748B; font-size:0.9rem;">View all user bookings, approve, reject, or cancel reservations</p>
      </div>
    </div>

    <div id="adminBookingsAlert"></div>

    <div class="table-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Booking ID</th>
              <th>Venue & Sport</th>
              <th>Date & Time</th>
              <th>Total Amount</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminBookingsTableBody">
            <!-- Rendered by admin.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
