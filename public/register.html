<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div id="regHeaderIcon" style="font-size:2.5rem; margin-bottom:8px;">🏆</div>
        <h2 id="regHeading">Create Your PlaySlot Account</h2>
        <p id="regSubheading" style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Join thousands of sports enthusiasts and players</p>
      </div>

      <!-- Role Selection Component (Strictly USER & TURF OWNER) -->
      <div class="role-selector-container">
        <span class="role-selector-title">Continue as</span>
        <div class="role-selector-grid">
          <button type="button" class="role-btn active" id="regRoleBtnUser" data-role="user">
            <span class="role-icon">👤</span>
            <span class="role-title">USER</span>
            <span class="role-desc">Book slots & grounds</span>
          </button>
          <button type="button" class="role-btn" id="regRoleBtnOwner" data-role="turf_owner">
            <span class="role-icon">🏟️</span>
            <span class="role-title">TURF OWNER</span>
            <span class="role-desc">List turfs & manage bookings</span>
          </button>
        </div>
      </div>

      <div id="registerAlertContainer"></div>

      <form id="registerForm">
        <!-- Hidden input for selected role -->
        <input type="hidden" id="selectedRegRole" value="user">

        <div class="form-group" style="margin-bottom:16px;">
          <label id="nameLabel">👤 Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required autocomplete="name">
        </div>

        <!-- Turf Owner Facility Name (dynamically shown for turf_owner) -->
        <div class="form-group" id="facilityNameGroup" style="margin-bottom:16px; display:none;">
          <label>🏟️ Turf / Facility Name</label>
          <input type="text" id="regFacility" class="form-input" placeholder="e.g. Prime Turf & Cricket Arena">
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>📞 Phone Number</label>
          <input type="tel" id="regPhone" class="form-input" placeholder="e.g. 9876543210" required autocomplete="tel">
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>📧 Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="e.g. user@playslot.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>🔒 Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label>🔒 Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem;">Register as User ⚡</button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="/login.html" id="loginLink" style="color:var(--primary-color); font-weight:700;">Login Here</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
