<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - PlaySlot</title>
  <meta name="description" content="Create your PlaySlot player account to book sports turfs and arenas.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge" style="width:48px; height:48px; margin:0 auto 12px auto; font-size:1.6rem;">⚡</div>
        <h2 style="font-size:1.7rem; font-weight:900;">Create an Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">
          Join thousands of players discovering & booking turfs on PlaySlot
        </p>
      </div>

      <div id="registerAlert"></div>

      <form id="userRegisterForm">
        <div class="form-group" style="margin-bottom:16px;">
          <label>Full Name *</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>Email Address *</label>
          <input type="email" id="regEmail" class="form-input" placeholder="e.g. rahul@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>Mobile Number *</label>
          <input type="tel" id="regPhone" class="form-input" placeholder="e.g. +91 98765 43210" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>Password *</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label>Confirm Password *</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:50px; font-size:1.05rem;">
          Create Account 🚀
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.92rem; color:var(--text-muted);">
        Already have an account? <a href="/login" style="color:var(--primary-color); font-weight:800;">Login Here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/data/mock-data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
