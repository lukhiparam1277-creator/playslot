<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size:2.5rem; margin-bottom:8px;">🏆</div>
        <h2>Create Your PlaySlot Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Join thousands of sports enthusiasts</p>
      </div>

      <div id="registerAlertContainer"></div>

      <form id="registerForm">
        <div class="form-group" style="margin-bottom:16px;">
          <label>👤 Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>📞 Phone Number</label>
          <input type="tel" id="regPhone" class="form-input" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>📧 Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="e.g. rahul@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom:16px;">
          <label>🔒 Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <div class="form-group" style="margin-bottom:24px;">
          <label>🔒 Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem;">Register Account ⚡</button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Already have an account? <a href="/login.html" style="color:var(--primary-color); font-weight:700;">Login Here</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
