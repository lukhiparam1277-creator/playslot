<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Categories (6) - PlaySlot</title>
  <meta name="description" content="Explore 6 premium sports categories: Football Turf, Box Cricket, Pickleball, Badminton, Basketball, and Golf.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div class="section-title">Sports Categories (<span id="totalCategoriesCount">6</span>)</div>
    <div class="section-subtitle">Select a sport category to view verified venues with real-time slot availability</div>

    <!-- Category Live Search & Filter Bar -->
    <div class="search-card" style="margin-bottom:40px;">
      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <input type="text" id="categorySearchInput" placeholder="🔍 Search sports (e.g. Football Turf, Box Cricket, Pickleball...)" class="form-input" style="height:50px;">
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline category-type-btn active" data-type="All">All Sports</button>
          <button class="btn btn-outline category-type-btn" data-type="Indoor">Indoor</button>
          <button class="btn btn-outline category-type-btn" data-type="Outdoor">Outdoor</button>
        </div>
      </div>
    </div>

    <!-- Sports Grid -->
    <div class="sports-grid" id="allSportsGrid"></div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/sports.js"></script>
</body>
</html>
