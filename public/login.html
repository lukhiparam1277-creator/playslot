<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PlaySlot</title>
  <meta name="description" content="Sign in to your PlaySlot player account to book sports turfs and track reservations.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Public Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-badge" style="width:48px; height:48px; margin:0 auto 12px auto; font-size:1.6rem;">⚡</div>
        <h2 style="font-size:1.7rem; font-weight:900;">Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">
          Sign in to access your turf bookings & player profile
        </p>
      </div>

      <div id="authAlertContainer"></div>

      <form id="userLoginForm">
        <div class="form-group" style="margin-bottom:16px;">
          <label>📧 Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="e.g. rahul@example.com" value="user@playslot.com" required autocomplete="email">
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label>🔒 Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" value="password123" required autocomplete="current-password">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:0.88rem;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" checked> Remember Me
          </label>
          <a href="#" style="color:var(--primary-color); font-weight:700;" onclick="alert('Password reset link dispatched to your email address.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" id="userLoginBtn" class="btn btn-primary" style="width:100%; height:50px; font-size:1.05rem;">
          Login 🚀
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.92rem; color:var(--text-muted);">
        Don't have an account? <a href="/register" style="color:var(--primary-color); font-weight:800;">Register Here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="/js/data/mock-data.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
