<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size:2.5rem; margin-bottom:8px;">⚽</div>
        <h2>Welcome Back to PlaySlot</h2>
        <p style="color:var(--text-muted); font-size:0.9rem; margin-top:4px;">Login to access real-time sports bookings</p>
      </div>

      <div id="authAlertContainer"></div>

      <form id="loginForm">
        <div class="form-group" style="margin-bottom:18px;">
          <label>📧 Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="e.g. user@playslot.com" required>
        </div>

        <div class="form-group" style="margin-bottom:18px;">
          <label>🔒 Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:0.88rem;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="rememberMe"> Remember Me
          </label>
          <a href="#" style="color:var(--primary-color); font-weight:600;" onclick="alert('Demo password reset link has been dispatched to your email.'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; height:48px; font-size:1rem;">Login to Account 🚀</button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.9rem; color:var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color:var(--primary-color); font-weight:700;">Register Here</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
