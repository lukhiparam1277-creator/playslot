<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - PlaySlot</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container" style="padding-top:40px; padding-bottom:80px;">
    <div class="section-title">My Bookings</div>
    <div class="section-subtitle">Manage all your upcoming and past sports slot reservations</div>

    <!-- Booking Tabs -->
    <div style="display:flex; gap:12px; margin-bottom:32px; border-bottom:1px solid var(--border-color); padding-bottom:12px;">
      <button class="btn booking-tab-btn active" data-tab="upcoming">Upcoming (<span id="upcomingCount">0</span>)</button>
      <button class="btn booking-tab-btn btn-outline" data-tab="completed">Completed (<span id="completedCount">0</span>)</button>
      <button class="btn booking-tab-btn btn-outline" data-tab="cancelled">Cancelled (<span id="cancelledCount">0</span>)</button>
    </div>

    <div id="myBookingsList">
      <!-- Rendered by my-bookings.js -->
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/app.js"></script>
  <script src="/js/my-bookings.js"></script>
</body>
</html>
