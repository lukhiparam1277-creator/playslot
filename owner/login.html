<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turf Partner Portal - PlaySlot</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);">

  <div class="card" style="max-width:480px; width:100%; margin:20px; box-shadow:0 25px 50px rgba(0,0,0,0.5);">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="logo-icon" style="width:48px; height:48px; margin:0 auto 12px auto; font-size:1.4rem;">⚡</div>
      <span class="dash-sidebar-badge" style="font-size:0.75rem; padding:4px 10px; margin-bottom:8px; display:inline-block;">PARTNER DASHBOARD</span>
      <h2 style="font-size:1.8rem; margin-bottom:6px;">Turf Owner Login</h2>
      <p style="font-size:0.88rem;">Manage your sports grounds, live slots, and payout settlements.</p>
    </div>

    <!-- Quick Switch Multi-Owner Demo Selector -->
    <div style="background:var(--primary-light); border:1px solid var(--primary); padding:14px; border-radius:var(--radius-md); margin-bottom:24px;">
      <div style="font-size:0.82rem; font-weight:800; color:var(--primary); margin-bottom:8px;">💡 Select Demo Owner Account:</div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <button class="btn btn-secondary btn-sm" id="selectOwnerA" style="justify-content:flex-start; text-align:left; font-size:0.8rem;">
          🏢 <strong>Owner A:</strong> Robert Downey (SportsHub Arena Group)
        </button>
        <button class="btn btn-secondary btn-sm" id="selectOwnerB" style="justify-content:flex-start; text-align:left; font-size:0.8rem;">
          🏟️ <strong>Owner B:</strong> Elena Rostova (Turf Nation LLC)
        </button>
      </div>
    </div>

    <form id="ownerLoginForm">
      <div class="form-group">
        <label class="form-label">Owner Email / Business ID</label>
        <input type="email" id="ownerEmailInput" class="form-input" value="robert@sportshub.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" value="password123" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full" id="ownerLoginBtn" style="margin-top:10px;">
        Access Owner Dashboard ➔
      </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-muted);">
      Want to partner with us? <a href="register.html" style="color:var(--primary); font-weight:700;">Apply to List Turf</a>
    </div>

    <div style="text-align:center; margin-top:14px; font-size:0.82rem;">
      <a href="../index.html" style="color:var(--text-light);">← Back to Public Website</a>
    </div>
  </div>

  <script type="module">
    import { AuthService } from '../js/services/authService.js';
    import { showToast } from '../js/common.js';

    document.getElementById('selectOwnerA')?.addEventListener('click', () => {
      document.getElementById('ownerEmailInput').value = 'robert@sportshub.com';
    });
    document.getElementById('selectOwnerB')?.addEventListener('click', () => {
      document.getElementById('ownerEmailInput').value = 'elena@turfnation.com';
    });

    document.getElementById('ownerLoginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('ownerEmailInput').value;
      const btn = document.getElementById('ownerLoginBtn');
      btn.disabled = true;
      btn.innerHTML = 'Signing In...';

      try {
        await AuthService.loginOwner(email, 'password123');
        showToast('Logged into Owner SaaS Portal', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 400);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = 'Access Owner Dashboard ➔';
      }
    });
  </script>
</body>
</html>
