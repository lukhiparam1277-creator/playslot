<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Venues - Owner Portal - PlaySlot</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Dynamic Owner Sidebar -->
    <div id="owner-sidebar-container"></div>

    <main class="dash-main">
      <header class="dash-header">
        <div class="dash-header-title">
          <h2>My Turf Venues</h2>
        </div>

        <div class="dash-header-actions">
          <a href="add-venue.html" class="btn btn-primary btn-sm">+ Add New Venue</a>
        </div>
      </header>

      <div class="dash-body">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
          <div>
            <h1 style="font-size:1.6rem; margin-bottom:4px;">Manage Your Arenas</h1>
            <p>Update pricing, toggle active status, and modify facilities.</p>
          </div>

          <a href="add-venue.html" class="btn btn-primary">
            + List Another Venue
          </a>
        </div>

        <!-- Venues Grid -->
        <div class="venues-grid" id="ownerVenuesGrid">
          <!-- Rendered by owner.js -->
        </div>

      </div>
    </main>
  </div>

  <script type="module">
    import { OwnerController } from '../js/owner.js';
    OwnerController.initVenuesList();
  </script>
</body>
</html>
