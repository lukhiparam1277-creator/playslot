<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Slots - Owner Portal - PlaySlot</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/owner.css">
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- Dynamic Owner Sidebar -->
    <div id="owner-sidebar-container"></div>

    <main class="dash-main">
      <header class="dash-header">
        <div class="dash-header-title">
          <h2>Slot Matrix Management</h2>
        </div>

        <div class="dash-header-actions">
          <button id="openAddSlotModalBtn" class="btn btn-primary btn-sm">+ Add Slot</button>
        </div>
      </header>

      <div class="dash-body">
        
        <!-- Slot Filter Toolbar -->
        <div class="slot-management-bar">
          <div class="form-group" style="margin-bottom:0; min-width:240px;">
            <label class="form-label">Select Turf Arena</label>
            <select id="slotVenueSelect" class="form-select" style="font-weight:700;">
              <!-- Populated by owner.js -->
            </select>
          </div>

          <div class="form-group" style="margin-bottom:0; min-width:180px;">
            <label class="form-label">Sport Filter</label>
            <select id="slotSportSelect" class="form-select">
              <option value="All">All Sports</option>
            </select>
          </div>

          <button id="openAddSlotModalBtn2" class="btn btn-primary" style="height:42px; margin-left:auto;">
            + Schedule New Slot
          </button>
        </div>

        <!-- Slots Schedule Table -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Time Slot</th>
                  <th>Sport</th>
                  <th>Period</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ownerSlotsTbody">
                <!-- Rendered by owner.js -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add Slot Modal -->
  <div class="modal-overlay" id="addSlotModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Add Slot to Schedule</h3>
        <button class="toast-close" onclick="document.getElementById('addSlotModal').classList.remove('open')">&times;</button>
      </div>
      <form id="addSlotForm">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Time Interval (e.g. 07:00 PM – 08:00 PM)</label>
            <input type="text" id="newSlotTimeInput" class="form-input" placeholder="07:00 PM – 08:00 PM" required>
          </div>

          <div class="form-group">
            <label class="form-label">Sport</label>
            <input type="text" id="newSlotSportInput" class="form-input" placeholder="Football" required>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div class="form-group">
              <label class="form-label">Period</label>
              <select id="newSlotPeriodSelect" class="form-select">
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening" selected>Evening</option>
                <option value="Night">Night</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Price (₹)</label>
              <input type="number" id="newSlotPriceInput" class="form-input" value="1200" required>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('addSlotModal').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary">Schedule Slot</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { OwnerController } from '../js/owner.js';
    OwnerController.initSlotsManager();

    document.getElementById('openAddSlotModalBtn2')?.addEventListener('click', () => {
      document.getElementById('addSlotModal').classList.add('open');
    });
  </script>
</body>
</html>
