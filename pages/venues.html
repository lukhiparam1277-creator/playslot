<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Sports Turfs & Arenas - PlaySlot</title>
  <meta name="description" content="Discover and filter sports arenas by city, sport category, rating, and price. Instant slot booking online.">
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container">
      <div class="catalog-layout">
        
        <!-- Filter Sidebar -->
        <aside class="filter-sidebar">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
            <h3 style="font-size:1.15rem;">Filters</h3>
            <span style="font-size:0.8rem; color:var(--primary); font-weight:700; cursor:pointer;" onclick="window.location.href='venues.html'">Reset All</span>
          </div>

          <!-- Location Filter -->
          <div class="filter-section">
            <div class="filter-title">📍 City / Location</div>
            <select id="catalogCitySelect" class="form-select">
              <option value="All">All Cities</option>
              <option value="Mumbai">Mumbai</option>
              <option value="Bengaluru">Bengaluru</option>
              <option value="Delhi">Delhi / NCR</option>
            </select>
          </div>

          <!-- Sports Filter Radio List -->
          <div class="filter-section">
            <div class="filter-title">🏆 Sport Category</div>
            <div id="filterSportsContainer" style="max-height:220px; overflow-y:auto;">
              <!-- Rendered by user.js -->
            </div>
          </div>

          <!-- Price Slider -->
          <div class="filter-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <div class="filter-title" style="margin-bottom:0;">💰 Max Hourly Rate</div>
              <span id="priceRangeValue" style="font-weight:800; color:var(--primary); font-size:0.9rem;">₹2,500</span>
            </div>
            <input type="range" id="priceRangeSlider" min="400" max="2500" step="100" value="2500" style="width:100%; accent-color:var(--primary); cursor:pointer;">
            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
              <span>₹400</span>
              <span>₹2,500</span>
            </div>
          </div>

          <!-- Amenities Filter preview -->
          <div class="filter-section">
            <div class="filter-title">✨ Popular Amenities</div>
            <div style="display:flex; flex-direction:column; gap:8px; font-size:0.88rem;">
              <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" checked disabled> 🚗 Parking</label>
              <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" checked disabled> 💡 Flood Lights</label>
              <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" checked disabled> 🚻 Washroom</label>
              <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" checked disabled> 💧 Drinking Water</label>
            </div>
          </div>
        </aside>

        <!-- Venues Catalog Main Content -->
        <section>
          <!-- Toolbar Header -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:16px;">
            <div>
              <h1 style="font-size:1.85rem; margin-bottom:4px;">Sports Turfs & Arenas</h1>
              <p id="venuesCountDisplay" style="font-size:0.9rem;">Loading arenas...</p>
            </div>

            <div style="display:flex; gap:12px; align-items:center;">
              <div class="search-input-group" style="min-width:240px;">
                <input type="text" id="catalogSearchInput" placeholder="Search by name or area..." class="form-input" style="padding-left:14px;">
              </div>

              <select id="catalogSortSelect" class="form-select" style="width:auto; font-weight:600;">
                <option value="recommended">Recommended</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
              </select>
            </div>
          </div>

          <!-- Venues Grid -->
          <div class="venues-grid" id="venuesCatalogGrid">
            <!-- Rendered dynamically by user.js -->
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { UserController } from '../js/user.js';
    UserController.initVenuesCatalog();
  </script>
</body>
</html>
