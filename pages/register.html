<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create PlaySlot Account</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="main-content" style="display:flex; align-items:center; justify-content:center; padding:50px 20px;">
    <div class="card" style="max-width:480px; width:100%;">
      <div style="text-align:center; margin-bottom:24px;">
        <div class="logo-icon" style="width:48px; height:48px; margin:0 auto 12px auto; font-size:1.5rem;">⚡</div>
        <h2 style="font-size:1.8rem; margin-bottom:6px;">Join PlaySlot</h2>
        <p style="font-size:0.9rem;">Create your player account to reserve slots in 30 seconds.</p>
      </div>

      <form id="userRegisterForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="regNameInput" class="form-input" placeholder="e.g. Sameer Verma" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmailInput" class="form-input" placeholder="sameer@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Phone Number</label>
          <input type="tel" id="regPhoneInput" class="form-input" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPasswordInput" class="form-input" placeholder="Create a secure password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="regSubmitBtn" style="margin-top:10px;">
          Create Free Account ➔
        </button>
      </form>

      <div style="text-align:center; margin-top:20px; font-size:0.88rem; color:var(--text-muted);">
        Already have an account? <a href="login.html" style="color:var(--primary); font-weight:700;">Log In</a>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { initNavbar, initFooter, showToast } from '../js/common.js';
    import { AuthService } from '../js/services/authService.js';

    await initNavbar();
    initFooter();

    document.getElementById('userRegisterForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = 'Creating Account...';

      try {
        await AuthService.registerUser({
          name: document.getElementById('regNameInput').value,
          email: document.getElementById('regEmailInput').value,
          phone: document.getElementById('regPhoneInput').value
        });
        showToast('Account created successfully! Welcome to PlaySlot.', 'success');
        setTimeout(() => window.location.href = '../index.html', 500);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = 'Create Free Account ➔';
      }
    });
  </script>
</body>
</html>
