<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - PlaySlot</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width:800px; padding:40px 20px 80px 20px;">
      
      <h1 style="font-size:2rem; margin-bottom:24px;">Player Profile & Settings</h1>

      <div class="card" style="margin-bottom:24px;">
        <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
          <img id="profileAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80" alt="Avatar" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:3px solid var(--primary);">
          <div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
              <h2 id="profileName" style="font-size:1.4rem;">Alex Morgan</h2>
              <span class="badge badge-success" id="profileStatus">Active Member</span>
            </div>
            <div id="profileEmail" style="color:var(--text-muted); font-size:0.9rem;">alex@example.com</div>
            <div id="profileJoined" style="font-size:0.8rem; color:var(--text-light); margin-top:4px;">Member since Jan 2026</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:20px;">Personal Details</h3>
        <form id="profileForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" id="editNameInput" class="form-input" value="Alex Morgan" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="editEmailInput" class="form-input" value="alex@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="editPhoneInput" class="form-input" value="+91 98765 00001" required>
          </div>

          <div class="form-group">
            <label class="form-label">Preferred Sport</label>
            <select class="form-select">
              <option value="Football">⚽ Football</option>
              <option value="Cricket">🏏 Cricket</option>
              <option value="Badminton">🏸 Badminton</option>
              <option value="Pickleball">🏓 Pickleball</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top:10px;">
            Save Profile Changes
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { initNavbar, initFooter, showToast } from '../js/common.js';
    import { AuthService } from '../js/services/authService.js';
    import { Storage } from '../js/services/storage.js';

    await initNavbar();
    initFooter();

    const auth = await AuthService.getCurrentAuth();
    const user = auth?.user || Storage.get('USERS')[0];

    if (user) {
      document.getElementById('profileName').textContent = user.name;
      document.getElementById('profileEmail').textContent = user.email;
      document.getElementById('profileAvatar').src = user.avatar;
      document.getElementById('profileJoined').textContent = `Member since ${user.joined}`;
      document.getElementById('editNameInput').value = user.name;
      document.getElementById('editEmailInput').value = user.email;
      document.getElementById('editPhoneInput').value = user.phone;
    }

    document.getElementById('profileForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Profile information updated!', 'success');
    });
  </script>
</body>
</html>
