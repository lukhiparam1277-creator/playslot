<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - PlaySlot</title>
  <!-- Google Fonts Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>

  <!-- Dynamic Navigation Bar -->
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="container" style="max-width:900px; padding:40px 20px 80px 20px;">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:16px;">
        <div>
          <h1 style="font-size:2rem; margin-bottom:4px;">My Turf Reservations</h1>
          <p>Track your upcoming matches, past bookings, and digital match passes.</p>
        </div>

        <a href="venues.html" class="btn btn-primary btn-sm">Book New Match ⚡</a>
      </div>

      <!-- Tab Buttons -->
      <div style="display:flex; gap:10px; margin-bottom:24px; border-bottom:1px solid var(--border-color); padding-bottom:12px;">
        <button class="btn btn-outline btn-sm booking-tab-btn active" data-tab="Upcoming">
          Upcoming Matches
        </button>
        <button class="btn btn-outline btn-sm booking-tab-btn" data-tab="Completed">
          Past Completed
        </button>
        <button class="btn btn-outline btn-sm booking-tab-btn" data-tab="Cancelled">
          Cancelled & Refunded
        </button>
      </div>

      <!-- Bookings List Container -->
      <div id="myBookingsList">
        <!-- Rendered by user.js -->
      </div>

    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <script type="module">
    import { UserController } from '../js/user.js';
    UserController.initMyBookings();
  </script>
</body>
</html>
